[package]
name = "folio_core"
version = "0.1.0"
edition = "2021"
description = "Folio Writer document engine: .docx model, Word-compatible layout, rendering and editing"

[lib]
name = "folio_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
cairo-rs = { version = "0.20", features = ["freetype", "png", "pdf", "v1_16"] }
freetype-rs = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
fontdb = "0.22"
rustybuzz = "0.18"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
quick-xml = { version = "0.36", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
geo = { version = "0.28", default-features = false }
regex = { version = "1.10", default-features = false, features = ["std", "unicode", "perf"] }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }

[profile.release]
opt-level = 3
debug = false
lto = "thin"

[profile.dev]
opt-level = 1
